[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groovestrike"
version = "0.1.0"
description = "Autonomous Penetration Testing Framework — the first MCP-native pentest tool that closes the loop from find to exploit to report to defend."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "GrooveXlabs"},
]
keywords = ["pentest", "security", "automation", "ai", "red-team", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
web = [
    "playwright>=1.40",
]

[project.scripts]
groovestrike = "groovestrike.cli:main"

[project.urls]
Homepage = "https://github.com/GrooveXlabs/groovestrike"
Repository = "https://github.com/GrooveXlabs/groovestrike"
Issues = "https://github.com/GrooveXlabs/groovestrike/issues"

[tool.hatch.build.targets.wheel]
packages = ["groovestrike"]

[tool.pytest.ini_options]
testpaths = ["groovestrike/tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
